name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Validate Supabase configuration
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL secret or repository variable" >&2
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY) secret" >&2
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/"

          curl --fail --show-error --silent --output /dev/null --max-time 20 \
            --retry 3 --retry-delay 5 \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            "$url"

          echo "Supabase REST API responded successfully"
